name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set model cache directory
        run: echo "MODEL_CACHE_DIR=$HOME/.cache/local-ocr-models" >> "$GITHUB_ENV"

      - name: Cache ML models
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: local-ocr-models-v1

      - name: Run tests
        env:
          LOCAL_OCR_BOOTSTRAP_MODELS: "1"
          LOCAL_OCR_MODEL_BASE_DIR: ${{ env.MODEL_CACHE_DIR }}
        run: python -m unittest discover -s tests -v
